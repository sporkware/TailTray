<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" version="1.1" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="128" cy="128" r="120" fill="url(#bg)" stroke="#1e40af" stroke-width="16"/>

  <!-- Tailscale logo simplified -->
  <g transform="translate(128,128)">
    <!-- Outer ring -->
    <circle r="80" fill="none" stroke="#ffffff" stroke-width="8" opacity="0.8"/>

    <!-- Inner network nodes -->
    <circle cx="-30" cy="-30" r="12" fill="#ffffff"/>
    <circle cx="30" cy="-30" r="12" fill="#ffffff"/>
    <circle cx="0" cy="40" r="12" fill="#ffffff"/>

    <!-- Connection lines -->
    <line x1="-30" y1="-30" x2="30" y2="-30" stroke="#ffffff" stroke-width="3" opacity="0.7"/>
    <line x1="-30" y1="-30" x2="0" y2="40" stroke="#ffffff" stroke-width="3" opacity="0.7"/>
    <line x1="30" y1="-30" x2="0" y2="40" stroke="#ffffff" stroke-width="3" opacity="0.7"/>

    <!-- Center node -->
    <circle cx="0" cy="0" r="16" fill="#ffffff"/>
  </g>

  <!-- Tray indicator dot -->
  <circle cx="200" cy="56" r="20" fill="#ef4444"/>
  <circle cx="200" cy="56" r="12" fill="#ffffff"/>
</svg>