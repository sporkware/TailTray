[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tailtray"
version = "0.1.0"
description = "Tailscale GUI for Linux - System tray application for KDE Plasma"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "TailTray Contributors", email = "tailtray@example.com"}
]
maintainers = [
    {name = "TailTray Contributors", email = "tailtray@example.com"}
]
keywords = ["tailscale", "vpn", "network", "gui", "kde", "plasma", "linux"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking",
    "Topic :: Desktop Environment :: K Desktop Environment (KDE)",
]
requires-python = ">=3.8"
dependencies = [
    "PyGObject>=3.40.0",
    "requests>=2.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
tailtray = "tailtray:main"

[project.urls]
Homepage = "https://github.com/yourusername/tailtray"
Repository = "https://github.com/yourusername/tailtray.git"
Issues = "https://github.com/yourusername/tailtray/issues"
Changelog = "https://github.com/yourusername/tailtray/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["tailtray"]
package-dir = {"" = "."}

[tool.setuptools.package-data]
tailtray = ["*.desktop", "*.service", "*.svg", "*.1"]

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "gi.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = [
    "tests",
]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]